<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>साहू ग्राहक सेवा केंद्र रसीद</title>
    <style>
        /* --- GENERAL STYLES --- */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e6edf7 0%, #f4f6fb 50%, #edf3ff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            transition: background 0.3s, color 0.3s;
        }

        h1 { margin: 0 0 24px 0; font-size: 28px; color: #1f3b5b; transition: color 0.3s; }

        .screen-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 1400px;
            overflow-x: auto;
            padding-bottom: 20px;
        }

        .input-panel {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
            width: 480px;
            min-width: 480px;
            border-top: 3px solid #2563eb;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 8px; color: #374151; transition: color 0.3s; }
        .form-group input, .form-group textarea { 
            width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        /* --- TAB STYLING --- */
        .major-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .major-btn { flex: 1; padding: 12px; font-weight: 700; border-radius: 8px; border: 2px solid #2563eb; cursor: pointer; background: white; color: #2563eb; transition: background 0.3s, color 0.3s; }
        .major-btn.active { background: #2563eb; color: white; }

        .sub-tabs { display: flex; gap: 5px; background: #f1f5f9; padding: 5px; border-radius: 999px; margin-bottom: 20px; transition: background 0.3s; }
        .sub-btn { flex: 1; border: none; background: transparent; padding: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 999px; transition: background 0.3s, color 0.3s; color: #374151; }
        .sub-btn.active { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #2563eb; }

        .button-group { display: flex; gap: 12px; margin-top: 10px; }
        .print-btn { background: linear-gradient(135deg, #16a34a, #22c55e); color: white; border: none; padding: 16px 20px; flex: 2; cursor: pointer; font-size: 18px; font-weight: 700; border-radius: 999px; box-shadow: 0 8px 18px rgba(22, 163, 74, 0.35); }
        .clear-btn { background: #ef4444; color: white; border: none; padding: 16px; flex: 1; cursor: pointer; font-size: 14px; font-weight: 700; border-radius: 999px; }

        /* --- RECEIPT PREVIEW (SCREEN) --- */
        #receipt-preview {
            background: #ffffff; width: 80mm; min-width: 80mm; padding: 6mm; border-radius: 10px; border: 1px solid #e5e7eb; color: #000; line-height: 1.6;
        }
        .receipt-header { text-align: center; font-weight: 800; font-size: 22px; }
        .receipt-subheader { text-align: center; font-size: 15px; margin-bottom: 10px; }
        .receipt-divider { border-top: 2px dashed #000; margin: 10px 0; }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .receipt-label { font-weight: 700; font-size: 15px; }
        .receipt-value { font-weight: 600; text-align: right; font-size: 15px; }
        .big-amount-row { text-align: center; border-top: 1px solid #000; border-bottom: 1px solid #000; padding: 10px 0; margin: 12px 0; }
        .big-amount-value { font-size: 32px; font-weight: 900; }
        .receipt-footer { text-align: center; margin-top: 20px; font-weight: 700; }

        /* --- HISTORY PANEL STYLES --- */
        .history-panel {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
            width: 320px;
            min-width: 320px; 
            border-top: 3px solid #8b5cf6;
            display: flex;
            flex-direction: column;
            max-height: 800px;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .history-panel h2 { margin: 0 0 16px 0; font-size: 20px; color: #374151; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; transition: color 0.3s, border-color 0.3s; }
        .history-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .history-controls input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; transition: background 0.3s, color 0.3s; }
        #historyList { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .history-item { background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 13px; line-height: 1.5; transition: background 0.3s, border-color 0.3s; }
        .history-item strong { color: #1e293b; font-size: 14px; display: block; margin-bottom: 4px; transition: color 0.3s; }
        
        .view-print-btn {
            margin-top: 10px;
            background: #e2e8f0;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s, color 0.3s;
        }
        .view-print-btn:hover { background: #cbd5e1; }

        /* --- DARK MODE STYLES --- */
        .theme-toggle {
            position: absolute; top: 20px; right: 20px; background: #1f3b5b; color: #fff; border: none;
            padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background 0.3s;
        }
        body.dark-mode { background: linear-gradient(135deg, #121212 0%, #1e1e1e 100%); color: #e5e7eb; }
        body.dark-mode h1 { color: #e5e7eb; }
        body.dark-mode .theme-toggle { background: #e5e7eb; color: #121212; }
        body.dark-mode .input-panel, body.dark-mode .history-panel { background: #1e293b; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
        body.dark-mode .form-group label, body.dark-mode .history-panel h2 { color: #cbd5e1; border-color: #334155; }
        body.dark-mode .form-group input, body.dark-mode .form-group textarea, body.dark-mode .history-controls input { background: #0f172a; color: #f8fafc; border-color: #334155; }
        body.dark-mode .major-btn { background: #1e293b; color: #60a5fa; border-color: #60a5fa; }
        body.dark-mode .major-btn.active { background: #60a5fa; color: #0f172a; }
        body.dark-mode .sub-tabs { background: #0f172a; }
        body.dark-mode .sub-btn { color: #94a3b8; }
        body.dark-mode .sub-btn.active { background: #1e293b; color: #60a5fa; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        body.dark-mode .history-item { background: #0f172a; border-color: #334155; color: #cbd5e1; }
        body.dark-mode .history-item strong { color: #f8fafc; }
        body.dark-mode .view-print-btn { background: #334155; color: #f8fafc; border-color: #475569; }
        body.dark-mode .view-print-btn:hover { background: #475569; }

        /* --- PROFESSIONAL PRINT STYLES --- */
        @media print {
            .input-panel, .history-panel, h1, .theme-toggle { display: none !important; }
            body { background: none; padding: 0; margin: 0; }
            #receipt-preview { 
                width: 58mm; 
                box-shadow: none; 
                border: none; 
                position: absolute; 
                left: 0; 
                top: 0; 
                padding: 2mm; 
                font-size: 15px; 
                line-height: 1.4;
            }
            .receipt-header { font-size: 20px !important; font-weight: 800; margin-bottom: 1mm; } 
            .receipt-subheader { font-size: 14px; font-weight: 400; margin-bottom: 2mm; }
            .receipt-row { margin-bottom: 4px; }
            .receipt-label { font-size: 14px; font-weight: 700; }
            .receipt-value { font-size: 15px; font-weight: 600; }
            .big-amount-row { padding: 6px 0; margin: 6px 0; }
            .big-amount-value { font-size: 32px !important; font-weight: 900; }
            .receipt-footer { font-size: 14px; margin-top: 15px; font-weight: 700; }
            .receipt-divider { border-top: 1.5px solid #000; margin: 6px 0; }
            @page { size: 58mm auto; margin: 0; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleDarkMode()">🌙 Dark / Light</button>

    <h1>साहू ग्राहक सेवा केंद्र, मोपका</h1>

    <div class="screen-wrapper">
        
        <div class="history-panel">
            <h2>पिछला रिकॉर्ड (History)</h2>
            <div class="history-controls">
                <input type="date" id="historyDate" onchange="renderHistory()">
                <input type="text" id="historySearch" placeholder="सर्च करें (नाम, आधार, बैंक, txn...)" oninput="renderHistory()">
            </div>
            <div id="historyList"></div>
        </div>

        <div class="input-panel">
            <div class="major-tabs">
                <button class="major-btn active" id="btnAuto" onclick="setMajorTab('auto')">Automatic</button>
                <button class="major-btn" id="btnManual" onclick="setMajorTab('manual')">Manual</button>
            </div>

            <div id="auto-controls">
                <div class="sub-tabs">
                    <button class="sub-btn active" id="subAutoWithdraw" onclick="setAutoSubTab('withdraw')">AEPS Withdrawal</button>
                    <button class="sub-btn" id="subAutoDeposit" onclick="setAutoSubTab('deposit')">AEPS Deposit</button>
                    <button class="sub-btn" id="subAutoTransfer" onclick="setAutoSubTab('transfer')">Money Transfer</button>
                </div>
                <div class="form-group">
                    <label>ग्राहक का नाम</label>
                    <input type="text" id="genName" class="clearable" oninput="updateReceipt()">
                </div>
                <div class="form-group">
                    <label id="autoPasteLabel">निकासी मैसेज पेस्ट करें</label>
                    <textarea id="genRawText" class="clearable" placeholder="Paste message here..." oninput="updateReceipt()" style="min-height: 100px;"></textarea>
                </div>
                <div class="form-group" id="autoTotalGroup" style="display:none">
                    <label>कुल राशि (Total Balance)</label>
                    <input type="text" id="autoTotalInput" class="clearable" placeholder="Enter total balance" oninput="updateReceipt()">
                </div>
            </div>

            <div id="manual-controls" style="display:none">
                <label style="font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px;">मोड चुनें</label>
                <div class="sub-tabs">
                    <button id="mATM" class="sub-btn active" onclick="setManualMode('ATM')">ATM</button>
                    <button id="mDep" class="sub-btn" onclick="setManualMode('AEPS Deposit')">AEPS Deposit</button>
                    <button id="mWith" class="sub-btn" onclick="setManualMode('AEPS Withdrawal')">AEPS Withdrawal</button>
                    <button id="mUPI" class="sub-btn" onclick="setManualMode('UPI')">UPI</button>
                </div>
                <div class="form-group"><label>ग्राहक का नाम</label><input type="text" id="inName" class="clearable" oninput="updateReceipt()"></div>
                
                <div class="form-group" id="mReceiverGroup" style="display:none"><label>Receiver Name (प्राप्तकर्ता)</label><input type="text" id="inReceiver" class="clearable" oninput="updateReceipt()"></div>
                <div class="form-group" id="mAadhaarGroup" style="display:none"><label>आधार नंबर</label><input type="text" id="inAadhaar" class="clearable" oninput="updateReceipt()"></div>
                <div class="form-group" id="mBankGroup"><label>बैंक का नाम</label><input type="text" id="inBank" class="clearable" oninput="updateReceipt()"></div>
                <div class="form-group" id="mTxnGroup"><label>ट्रांजैक्शन आईडी</label><input type="text" id="inTxn" class="clearable" oninput="updateReceipt()"></div>
                
                <div class="form-group"><label id="manualAmtLabel">राशि</label><input type="number" id="inAmt" class="clearable" oninput="updateReceipt()"></div>
                
                <div class="form-group" id="mTotalGroup"><label id="manualTotalLabel">शेष राशि</label><input type="text" id="inTotal" class="clearable" oninput="updateReceipt()"></div>
            </div>

            <div class="form-group">
                <label>रसीद संख्या</label>
                <input type="number" id="inReceiptNo" oninput="updateReceiptNo(this.value)">
            </div>

            <div class="button-group">
                <button class="clear-btn" onclick="clearFields()">साफ करें</button>
                <button class="print-btn" onclick="handlePrint()">प्रिंट करें</button>
            </div>
        </div>

        <div id="receipt-preview">
            <div class="receipt-header">साहू ग्राहक सेवा केंद्र, मोपका</div>
            <div class="receipt-subheader"><span id="outTime">लोड हो रहा है...</span></div>
            <div class="receipt-divider"></div>

            <div class="receipt-row"><span class="receipt-label">ग्राहक का नाम</span><span class="receipt-value" id="outName">-----</span></div>
            <div class="receipt-row"><span class="receipt-label">रसीद संख्या</span><span class="receipt-value" id="outReceiptNo">0001</span></div>
            <div class="receipt-row"><span class="receipt-label">मोड</span><span class="receipt-value" id="outMode">ATM</span></div>
            
            <div class="receipt-row" id="outBeneRow" style="display:none"><span class="receipt-label">प्राप्तकर्ता</span><span class="receipt-value" id="outBene">-----</span></div>
            <div class="receipt-row" id="outAccRow" style="display:none"><span class="receipt-label">खाता संख्या</span><span class="receipt-value" id="outAcc">-----</span></div>
            
            <div class="receipt-row" id="outAadhaarRow" style="display:none"><span class="receipt-label">आधार नंबर</span><span class="receipt-value" id="outAadhaar">-----</span></div>
            <div class="receipt-row" id="outBankRow"><span class="receipt-label">बैंक</span><span class="receipt-value" id="outBank">-----</span></div>
            <div class="receipt-row" id="outTxnRow"><span class="receipt-label">ट्रांजैक्शन आईडी</span><span class="receipt-value" id="outTxn">-----</span></div>

            <div class="big-amount-row">
                <span class="receipt-label" id="outAmtLabel">निकासी राशि</span>
                <div class="big-amount-value">₹<span id="outAmt">0</span></div>
            </div>

            <div class="receipt-row" id="outTotalRow"><span class="receipt-label" id="outTotalLabel">शेष राशि</span><span class="receipt-value">₹<span id="outTotal">0.00</span></span></div>

            <div class="receipt-divider"></div>
            <div class="receipt-footer">धन्यवाद ,कृपया पुनः पधारे 🙏</div>
        </div>

    </div>

    <script>
        let majorTab = 'auto';
        let autoSub = 'withdraw';
        let manualMode = 'ATM';
        
        let receiptHistory = JSON.parse(localStorage.getItem('receiptHistory') || '[]');

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        function formatNumber(val) {
            if (!val || isNaN(val.toString().replace(/,/g, ''))) return val;
            let num = val.toString().replace(/,/g, '');
            return Number(num).toLocaleString('en-IN');
        }

        function setMajorTab(t) {
            majorTab = t;
            clearFields();
            document.getElementById('btnAuto').classList.toggle('active', t === 'auto');
            document.getElementById('btnManual').classList.toggle('active', t === 'manual');
            document.getElementById('auto-controls').style.display = (t === 'auto' ? 'block' : 'none');
            document.getElementById('manual-controls').style.display = (t === 'manual' ? 'block' : 'none');
            updateReceipt();
        }

        function setAutoSubTab(s) {
            autoSub = s;
            clearFields();
            document.getElementById('subAutoWithdraw').classList.toggle('active', s === 'withdraw');
            document.getElementById('subAutoDeposit').classList.toggle('active', s === 'deposit');
            document.getElementById('subAutoTransfer').classList.toggle('active', s === 'transfer');
            
            let labelText = 'निकासी मैसेज पेस्ट करें';
            if(s === 'deposit') labelText = 'जमा मैसेज पेस्ट करें';
            if(s === 'transfer') labelText = 'ट्रांसफर मैसेज पेस्ट करें';
            
            document.getElementById('autoPasteLabel').textContent = labelText;
            document.getElementById('autoTotalGroup').style.display = (s !== 'withdraw' ? 'block' : 'none');
            updateReceipt();
        }

        function setManualMode(m) {
            manualMode = m;
            clearFields();
            document.getElementById('mATM').classList.toggle('active', m === 'ATM');
            document.getElementById('mDep').classList.toggle('active', m === 'AEPS Deposit');
            document.getElementById('mWith').classList.toggle('active', m === 'AEPS Withdrawal');
            document.getElementById('mUPI').classList.toggle('active', m === 'UPI');
            
            let isUPI = (m === 'UPI');
            document.getElementById('mAadhaarGroup').style.display = (m === 'ATM' || isUPI ? 'none' : 'block');
            document.getElementById('mBankGroup').style.display = isUPI ? 'none' : 'block';
            document.getElementById('mTxnGroup').style.display = isUPI ? 'none' : 'block';
            document.getElementById('mTotalGroup').style.display = isUPI ? 'none' : 'block';
            document.getElementById('mReceiverGroup').style.display = isUPI ? 'block' : 'none';

            document.getElementById('manualAmtLabel').textContent = (m === 'AEPS Deposit' ? 'जमा राशि' : (isUPI ? 'राशि' : 'निकासी राशि'));
            document.getElementById('manualTotalLabel').textContent = (m === 'AEPS Deposit' ? 'कुल राशि' : 'शेष राशि');
            updateReceipt();
        }

        function parseAuto() {
            const raw = document.getElementById('genRawText').value || '';
            const res = { bank: '-----', amt: '0', total: '0.00', txn: '-----', aadhaar: '-----', bene: '-----', acc: '-----', name: '' };
            
            if (autoSub === 'transfer') {
                const lines = raw.split('\n');
                const details = {};
                lines.forEach(line => {
                    const parts = line.split('\t');
                    if (parts.length === 2) {
                        details[parts[0].trim()] = parts[1].trim();
                    }
                });
                
                if (details['Bene Bank and IFSC']) res.bank = details['Bene Bank and IFSC'];
                if (details['Txn Amount']) res.amt = details['Txn Amount'].replace('₹', '');
                if (details['Txn ID']) res.txn = details['Txn ID'];
                if (details['Bene Name']) res.bene = details['Bene Name'];
                if (details['Bene Account No.']) res.acc = details['Bene Account No.'];
                if (details['Total Amt']) res.total = details['Total Amt'].replace('₹', '');
                if (details['Customer Name & Mobile']) {
                    res.name = details['Customer Name & Mobile'].split(' - ')[0]; 
                }
            } else {
                const bankMatch = raw.match(/(?:Bank Name[:\s]+|Customer Bank Name\s+)([^\n\r]+)/i);
                const amtMatch = raw.match(/(?:Withdrawal|Deposit) Amount\s+([0-9.,]+)/i);
                const txnMatch = raw.match(/Transaction ID\s+([0-9]+)/i);
                const aadharMatch = raw.match(/Aadhaar Number\s+([xX0-9 ]+)/i);
                const totalMatch = raw.match(/(?:Available Balance|Balance)[:\s]+([0-9.,NA]+)/i);
                const nameMatch = raw.match(/Customer Name\s+([^\n\r]+)/i);

                if (bankMatch) res.bank = bankMatch[1].trim();
                if (amtMatch) res.amt = amtMatch[1];
                if (txnMatch) res.txn = txnMatch[1];
                if (aadharMatch) res.aadhaar = aadharMatch[1].trim();
                if (totalMatch && totalMatch[1] !== 'NA') res.total = totalMatch[1];
                if (nameMatch) res.name = nameMatch[1].trim(); 
            }
            
            return res;
        }

        function updateReceipt() {
            let name, bank, mode, amt, total, aadhaar, txn, bene, acc, isDeposit, isTransfer, isUPI;

            if (majorTab === 'auto') {
                const p = parseAuto();

                if (p.name && document.activeElement === document.getElementById('genRawText')) {
                    document.getElementById('genName').value = p.name;
                }

                isDeposit = (autoSub === 'deposit');
                isTransfer = (autoSub === 'transfer');
                isUPI = false;
                mode = isTransfer ? 'Money Transfer' : (isDeposit ? 'AEPS Deposit' : 'AEPS Withdrawal');
                
                name = document.getElementById('genName').value || p.name || '-----';
                bank = p.bank; amt = p.amt; txn = p.txn; aadhaar = p.aadhaar;
                bene = p.bene; acc = p.acc;
                total = (isDeposit || isTransfer) ? (document.getElementById('autoTotalInput').value || p.total) : p.total;
            } else {
                isDeposit = (manualMode === 'AEPS Deposit');
                isTransfer = false;
                isUPI = (manualMode === 'UPI');
                mode = manualMode;
                name = document.getElementById('inName').value || '-----';
                bank = document.getElementById('inBank').value || '-----';
                amt = document.getElementById('inAmt').value || '0';
                total = document.getElementById('inTotal').value || '0.00';
                txn = document.getElementById('inTxn').value || '-----';
                aadhaar = document.getElementById('inAadhaar').value || '-----';
                bene = document.getElementById('inReceiver').value || '-----';
            }

            document.getElementById('outName').textContent = name;
            document.getElementById('outMode').textContent = mode;
            document.getElementById('outBank').textContent = bank;
            document.getElementById('outAmt').textContent = formatNumber(amt);
            document.getElementById('outTotal').textContent = formatNumber(total);
            document.getElementById('outTxn').textContent = txn;
            document.getElementById('outAadhaar').textContent = aadhaar;
            
            document.getElementById('outAadhaarRow').style.display = (mode === 'ATM' || isTransfer || isUPI ? 'none' : 'flex');
            document.getElementById('outBeneRow').style.display = (isTransfer || isUPI ? 'flex' : 'none');
            document.getElementById('outAccRow').style.display = (isTransfer ? 'flex' : 'none');
            document.getElementById('outBankRow').style.display = (isUPI ? 'none' : 'flex');
            document.getElementById('outTxnRow').style.display = (isUPI ? 'none' : 'flex');
            document.getElementById('outTotalRow').style.display = (isUPI ? 'none' : 'flex');

            document.getElementById('outBene').textContent = bene;
            document.getElementById('outAcc').textContent = acc;
            
            document.getElementById('outAmtLabel').textContent = isDeposit ? 'जमा राशि' : (isTransfer ? 'ट्रांसफर राशि' : (isUPI ? 'राशि' : 'निकासी राशि'));
            document.getElementById('outTotalLabel').textContent = isDeposit || isTransfer ? 'कुल राशि' : 'शेष राशि';
        }

        function updateReceiptNo(v) {
            document.getElementById('outReceiptNo').textContent = v.toString().padStart(4, '0');
            localStorage.setItem('rNo', v);
        }

        function saveToHistory() {
            const rNo = document.getElementById('outReceiptNo').textContent;
            const name = document.getElementById('outName').textContent;
            const mode = document.getElementById('outMode').textContent;
            const amt = document.getElementById('outAmt').textContent;
            const bank = document.getElementById('outBank').textContent;
            const txn = document.getElementById('outTxn').textContent;
            const aadhaar = document.getElementById('outAadhaar').textContent;
            
            const now = new Date();
            const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            const fullDate = document.getElementById('outTime').textContent;

            const entry = { rNo, name, mode, amt, bank, txn, aadhaar, dateStr, fullDate };
            
            const existingIndex = receiptHistory.findIndex(i => i.rNo === rNo);
            if (existingIndex >= 0) {
                receiptHistory[existingIndex] = entry; 
            } else {
                receiptHistory.push(entry);
            }

            localStorage.setItem('receiptHistory', JSON.stringify(receiptHistory));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const dateFilter = document.getElementById('historyDate').value;
            const searchFilter = document.getElementById('historySearch').value.toLowerCase();

            list.innerHTML = '';
            
            let filtered = receiptHistory.filter(item => {
                let matchDate = dateFilter ? item.dateStr === dateFilter : true;
                let searchString = `${item.rNo} ${item.name} ${item.mode} ${item.amt} ${item.bank} ${item.txn} ${item.aadhaar}`.toLowerCase();
                let matchSearch = searchFilter ? searchString.includes(searchFilter) : true;
                return matchDate && matchSearch;
            });

            [...filtered].reverse().forEach(item => {
                list.innerHTML += `
                    <div class="history-item">
                        <strong>${item.name}</strong>
                        ${item.mode !== 'UPI' ? `<div>बैंक: ${item.bank}</div>` : ''}
                        <div>राशि: ₹${item.amt}</div>
                        <button class="view-print-btn" onclick="viewAndPrint('${item.rNo}')">View & Print</button>
                    </div>
                `;
            });
        }

        function viewHistoryItem(rNo) {
            const item = receiptHistory.find(i => i.rNo === rNo);
            if(!item) return;

            document.getElementById('outReceiptNo').textContent = item.rNo;
            document.getElementById('outName').textContent = item.name;
            document.getElementById('outMode').textContent = item.mode;
            document.getElementById('outBank').textContent = item.bank;
            document.getElementById('outAmt').textContent = item.amt;
            document.getElementById('outTxn').textContent = item.txn;
            document.getElementById('outAadhaar').textContent = item.aadhaar;
            document.getElementById('outTime').textContent = item.fullDate;
            
            document.getElementById('outAadhaarRow').style.display = (item.aadhaar !== '-----' ? 'flex' : 'none');
            document.getElementById('outBeneRow').style.display = 'none';
            document.getElementById('outAccRow').style.display = 'none';
            document.getElementById('outBankRow').style.display = (item.mode === 'UPI' ? 'none' : 'flex');
            document.getElementById('outTxnRow').style.display = (item.mode === 'UPI' ? 'none' : 'flex');
            document.getElementById('outTotalRow').style.display = (item.mode === 'UPI' ? 'none' : 'flex');
            
            document.getElementById('outAmtLabel').textContent = (item.mode === 'AEPS Deposit') ? 'जमा राशि' : (item.mode === 'Money Transfer' ? 'ट्रांसफर राशि' : (item.mode === 'UPI' ? 'राशि' : 'निकासी राशि'));
        }

        function viewAndPrint(rNo) {
            viewHistoryItem(rNo);
            setTimeout(() => {
                window.print();
            }, 100);
        }

        function handlePrint() {
            saveToHistory(); 
            window.print();
            let n = parseInt(localStorage.getItem('rNo') || '1') + 1;
            updateReceiptNo(n.toString());
            document.getElementById('inReceiptNo').value = n;
        }

        function clearFields() {
            document.querySelectorAll('.clearable').forEach(i => i.value = '');
            updateReceipt();
        }

        setInterval(() => {
            const n = new Date();
            document.getElementById('outTime').textContent = n.toLocaleString('hi-IN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
        }, 1000);

        const saved = localStorage.getItem('rNo') || '1';
        document.getElementById('inReceiptNo').value = saved;
        updateReceiptNo(saved);
        setMajorTab('auto');
        
        renderHistory();
    </script>
</body>
</html>
